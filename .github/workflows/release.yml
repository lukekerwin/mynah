name: Release

# Push a tag like v0.2.0 (matching the VERSION file) to build and publish a DMG.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build app
        env:
          MYNAH_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build_app.sh
      - name: Build DMG
        run: scripts/make_dmg.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Mynah-*.dmg dist/Mynah-*.dmg.sha256 \
            --title "Mynah $(cat VERSION)" --notes-file .github/release-notes.md
