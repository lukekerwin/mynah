[project]
name = "mynah-engine"
version = "0.1.0"
description = "Mynah inference engine: local speech-to-text + LLM cleanup on MLX"
readme = "README.md"
authors = [
    { name = "Luke Kerwin" }
]
requires-python = ">=3.12"
dependencies = [
    "jellyfish>=1.3.0",
    "mlx-audio>=0.5.9",
    "mlx-lm>=0.32.2",
    "numpy>=2.5.4",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
